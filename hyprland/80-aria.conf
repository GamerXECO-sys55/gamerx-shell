# Aria reservations — vanilla edition keeps these inert; Aria edition ships
# the matching service + Quickshell module. SUPER+SPACE is reserved either way.

# Trigger Aria overlay (no-op on vanilla until Aria edition installs the
# matching Quickshell module).
bind = SUPER, SPACE, exec, qs ipc call aria toggleOverlay 2>/dev/null || notify-send "Aria not installed" "Install GamerX OS Aria edition or the gamerx-meta-aria package."

# Push-to-talk to Aria (held key)
bind = SUPER, grave, exec, qs ipc call aria pushToTalkStart 2>/dev/null
bindr = SUPER, grave, exec, qs ipc call aria pushToTalkStop  2>/dev/null
