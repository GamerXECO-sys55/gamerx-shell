# Window rules — GamerX OS default
# Layer rules first, then window rules.

# Quickshell overlays (control center, launcher, OSD, Aria, notifications)
layerrule = blur, gamerx-shell
layerrule = blur, rofi
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, gamerx-shell
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window

# Notifications animate from the right
layerrule = animation slide right, swaync-notification-window
layerrule = animation slide right, swaync-control-center

# Launcher pops in
layerrule = animation popin 75%, rofi

# Pin Quickshell on top
windowrulev2 = float,        class:^(gamerx-shell)$
windowrulev2 = noborder,     class:^(gamerx-shell)$
windowrulev2 = noshadow,     class:^(gamerx-shell)$
windowrulev2 = noinitialfocus, class:^(gamerx-shell)$

# Picture-in-picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin,   title:^(Picture-in-Picture)$
windowrulev2 = size 480 270, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-490 100%-280, title:^(Picture-in-Picture)$

# Common dialogs
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(file_progress|confirm|dialog|download|notification|error|splash|confirmreset)$
windowrulev2 = float, title:^(Open File|Save File|File Operation Progress)$

# Steam, Lutris, gamemode noise
windowrulev2 = workspace 5 silent, class:^(steam)$
windowrulev2 = workspace 5 silent, class:^(net.lutris.Lutris)$

# Tearing for fullscreen games (when allow_tearing is enabled per-monitor)
windowrulev2 = immediate, title:.*\.exe
windowrulev2 = immediate, class:^(steam_app_)
