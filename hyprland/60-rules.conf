# GamerX OS · Window & layer rules (Hyprland 0.53+ syntax)
# New syntax: `windowrule = ACTION, match:KEY VALUE` and
#             `layerrule = ACTION, match:namespace VALUE`.
# No more ^...$ anchors, no more 'windowrulev2'.

# ######## Layer rules ##########################################################

# Quickshell-rendered overlays
layerrule = blur true,            match:namespace gamerx-bar
layerrule = blur true,            match:namespace gamerx-launcher
layerrule = blur true,            match:namespace gamerx-controlcenter
layerrule = blur true,            match:namespace gamerx-powermenu
layerrule = blur true,            match:namespace gamerx-osd
layerrule = blur true,            match:namespace gamerx-notifications
layerrule = animation fade,       match:namespace gamerx-bar
layerrule = animation popin 75%,  match:namespace gamerx-launcher
layerrule = animation slide right, match:namespace gamerx-controlcenter
layerrule = animation popin 90%,  match:namespace gamerx-powermenu
layerrule = animation popin 75%,  match:namespace gamerx-osd
layerrule = animation slide right, match:namespace gamerx-notifications

# ######## Window rules #########################################################

# Centre all floating windows except XWayland popups
windowrule = center true, match:float true, match:xwayland false

# Picture-in-picture
windowrule = float true,             match:title Picture(-| )in(-| )[Pp]icture
windowrule = pin true,               match:title Picture(-| )in(-| )[Pp]icture
windowrule = size 480 270,           match:title Picture(-| )in(-| )[Pp]icture
windowrule = move 100%-490 100%-280, match:title Picture(-| )in(-| )[Pp]icture
windowrule = keep_aspect_ratio true, match:title Picture(-| )in(-| )[Pp]icture

# Common dialogs - float
windowrule = float true, match:class org\.pulseaudio\.pavucontrol
windowrule = float true, match:class blueman-manager
windowrule = float true, match:class org\.gnome\.Settings
windowrule = float true, match:class nm-connection-editor

# Steam, Lutris (sit on workspace 5)
windowrule = workspace 5 silent, match:class steam
windowrule = workspace 5 silent, match:class net\.lutris\.Lutris

# Tearing for fullscreen games
windowrule = immediate true,    match:class steam_app_(default|[0-9]+)|gamescope
windowrule = opaque true,       match:class steam_app_(default|[0-9]+)|gamescope
windowrule = idle_inhibit always, match:class steam_app_(default|[0-9]+)|gamescope

# File pickers / progress dialogs
windowrule = float true, match:title (Select|Open)( a)? (File|Folder)(s)?
windowrule = float true, match:title File (Operation|Upload)( Progress)?
windowrule = float true, match:title .* Properties
