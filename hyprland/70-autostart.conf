: << 'NOTES'
GamerX OS · Hyprland autostart

The shell is fully Quickshell — `qs -p /usr/share/gamerx-shell/quickshell` brings up the
bar, launcher, control center, OSD, power menu, and notifications.
Waybar / rofi / swaync are installed as fallbacks but NOT autostarted.
NOTES

# XDG portal & polkit (needed before anything else)
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Wallpaper engine
exec-once = swww-daemon &
exec-once = sleep 0.5 && swww img "$(gamerx-theme get wallpaper 2>/dev/null || echo /usr/share/gamerx/wallpapers/default/01-aurora-3840x2160.svg)" --transition-type any --transition-duration 1.5

# GamerX Quickshell shell — bar, launcher, control center, OSD, notifications
exec-once = qs -p /usr/share/gamerx-shell/quickshell

# Idle handling
exec-once = hypridle

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Network applet (NetworkManager)
exec-once = nm-applet --indicator

# First-run welcome (only the first time)
exec-once = [[ ! -f ~/.config/gamerx/welcome.done ]] && gamerx-welcome --first-run

# Aria (Aria edition only — the unit is masked on vanilla)
exec-once = systemctl --user start aria.service 2>/dev/null || true
