# GamerX OS · Hyprland autostart
#
# All session bring-up is delegated to a single robust script. Hyprland's
# exec-once is brittle (no shell, silent failures) so we use it only to spawn
# the orchestrator. The orchestrator handles ALL the actual app launching,
# fallbacks, and live-ISO Calamares auto-launch, with logging at
# ~/.cache/gamerx-shell-start.log.
exec-once = /usr/bin/gamerx-shell-start
