# GamerX OS · Hyprland autostart
#
# CRITICAL: Hyprland's exec / exec-once does NOT go through a shell.
# Anything using &, &&, >, |, $(...) MUST be wrapped in bash -c '...'.
#
# The shell is fully Quickshell — `qs -p /usr/share/gamerx-shell/quickshell` brings up
# the bar, launcher, control center, OSD, power menu, and notifications.

# XDG portal env import + polkit
exec-once = bash -c 'systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY'
exec-once = bash -c 'dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP'
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Wallpaper engine — start daemon, then set wallpaper
exec-once = swww-daemon
exec-once = bash -c 'sleep 1 && swww img "$(gamerx-theme get wallpaper 2>/dev/null || echo /usr/share/gamerx/wallpapers/default/01-aurora-preview-1920x1080.png)" --transition-type any --transition-duration 1.5'

# GamerX Quickshell shell — bar, launcher, control center, OSD, notifications
exec-once = qs -p /usr/share/gamerx-shell/quickshell

# Idle handling
exec-once = hypridle

# Clipboard history
exec-once = bash -c 'wl-paste --type text --watch cliphist store'
exec-once = bash -c 'wl-paste --type image --watch cliphist store'

# Network applet
exec-once = nm-applet --indicator

# First-run welcome (only the first time on installed system)
exec-once = bash -c '[[ ! -f ~/.config/gamerx/welcome.done ]] && gamerx-welcome --first-run'

# Aria (Aria edition only — the unit is masked on vanilla)
exec-once = bash -c 'systemctl --user start aria.service 2>/dev/null || true'
