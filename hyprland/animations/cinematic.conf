# Animation: cinematic (premium feel)
animations {
    enabled = true

    bezier = gxOut, 0.22, 1, 0.36, 1
    bezier = gxIn,  0.36, 0, 0.66, 0
    bezier = gxOver,0.34, 1.56, 0.64, 1   # subtle overshoot
    bezier = gxLinear, 0, 0, 1, 1

    animation = global,            1, 5,  gxOut
    animation = windows,           1, 5,  gxOver, popin 92%
    animation = windowsIn,         1, 5,  gxOver, popin 92%
    animation = windowsOut,        1, 4,  gxIn,   popin 92%
    animation = fade,              1, 4,  gxOut
    animation = workspaces,        1, 5,  gxOut,  slidevert
    animation = specialWorkspace,  1, 5,  gxOut,  slidefadevert 25%
    animation = layers,            1, 4,  gxOut,  slidefade 30%
    animation = border,            1, 12, gxOut
    animation = borderangle,       1, 60, gxLinear, loop
}
