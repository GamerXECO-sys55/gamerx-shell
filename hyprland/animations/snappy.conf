# Animation: snappy (productivity)
animations {
    enabled = true

    bezier = gxOut, 0.16, 1, 0.3, 1
    bezier = gxIn,  0.5, 0, 0.75, 0
    bezier = gxLinear, 0, 0, 1, 1

    animation = global,            1, 2, gxOut
    animation = windows,           1, 2, gxOut, popin 95%
    animation = windowsIn,         1, 2, gxOut, popin 95%
    animation = windowsOut,        1, 1.5, gxIn, popin 95%
    animation = fade,              1, 1.5, gxOut
    animation = workspaces,        1, 2, gxOut, slidevert
    animation = specialWorkspace,  1, 2, gxOut, slidevert
    animation = layers,            1, 1.5, gxOut, slide
    animation = border,            1, 6,   gxOut
    animation = borderangle,       1, 24,  gxLinear, loop
}
