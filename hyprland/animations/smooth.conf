# Animation: smooth (default — the GamerX curve)
# Cubic-bezier(0.16, 1, 0.3, 1) at ~220ms total. Fast in, smooth tail out.
# Premium without slowing the user down.

animations {
    enabled = true

    # Custom GamerX bezier — same easing used in Quickshell modules.
    bezier = gxOut, 0.16, 1, 0.3, 1
    bezier = gxIn,  0.4, 0, 1, 1
    bezier = gxLinear, 0, 0, 1, 1

    animation = global,            1, 3, gxOut
    animation = windows,           1, 3, gxOut, popin 90%
    animation = windowsIn,         1, 3, gxOut, popin 90%
    animation = windowsOut,        1, 2.5, gxIn,  popin 90%
    animation = fade,              1, 2.5, gxOut
    animation = workspaces,        1, 3, gxOut, slidevert
    animation = specialWorkspace,  1, 3, gxOut, slidefadevert 20%
    animation = layers,            1, 2.5, gxOut, slidefade 20%
    animation = border,            1, 8, gxOut
    animation = borderangle,       1, 40, gxLinear, loop
}
