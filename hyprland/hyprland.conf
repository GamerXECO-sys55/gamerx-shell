# GamerX OS · Hyprland config
# This file is the entry point. Each section is split into its own file so the
# gamerx-theme CLI can swap individual pieces without touching the rest.
#
# Density and animation files are symlinks managed by gamerx-theme. The user
# never edits them directly; instead:
#
#   gamerx-theme set density compact
#   gamerx-theme set animation snappy
#
# To extend with personal tweaks, drop a file into ~/.config/hypr/local/ — it
# gets sourced last and overrides anything above.

source = ~/.config/hypr/00-monitors.conf
source = ~/.config/hypr/10-input.conf
source = ~/.config/hypr/20-environment.conf
source = ~/.config/hypr/30-decoration.conf

# Density (managed by gamerx-theme; symlink to one of the density/ presets)
source = ~/.config/hypr/density.conf

# Animations (managed by gamerx-theme; symlink to one of the animations/ presets)
source = ~/.config/hypr/animations.conf

source = ~/.config/hypr/50-keybinds.conf
source = ~/.config/hypr/60-rules.conf
source = ~/.config/hypr/70-autostart.conf
source = ~/.config/hypr/80-aria.conf

# User overrides — every file in this dir is sourced after the defaults.
source = ~/.config/hypr/local/*.conf
