# Decoration — GamerX OS default
# Window borders, rounding, blur, drop shadow.
# Color values reference active palette: written by gamerx-theme.
# Until the theme renderer runs once, these literal hex values are the
# GamerX Purple defaults.

general {
    border_size                 = 2
    col.active_border           = rgb(7C3AED) rgb(00D9FF) 45deg
    col.inactive_border         = rgba(2A315888)
    layout                      = dwindle
    resize_on_border            = true
    extend_border_grab_area     = 8
    hover_icon_on_border        = true
    allow_tearing               = false
}

decoration {
    rounding = 12

    blur {
        enabled                 = true
        size                    = 6
        passes                  = 3
        new_optimizations       = true
        ignore_opacity          = true
        xray                    = false
        special                 = false
        popups                  = true
        popups_ignorealpha      = 0.6
        contrast                = 0.95
        brightness              = 1.0
        noise                   = 0.012
    }

    shadow {
        enabled                 = true
        range                   = 24
        render_power            = 3
        ignore_window           = true
        color                   = rgba(00000080)
        color_inactive          = rgba(00000050)
        offset                  = 0 4
        scale                   = 0.97
    }

    dim_inactive                = false
    dim_strength                = 0.10
    dim_special                 = 0.4
}

dwindle {
    pseudotile          = true
    preserve_split      = true
    smart_split         = false
    smart_resizing      = true
    force_split         = 0
    special_scale_factor= 0.95
}

master {
    new_status              = master
    mfact                   = 0.55
    orientation             = left
    smart_resizing          = true
    special_scale_factor    = 0.95
}

misc {
    disable_hyprland_logo       = true
    disable_splash_rendering    = true
    force_default_wallpaper     = 0
    vfr                         = true
    vrr                         = 1
    enable_swallow              = true
    swallow_regex               = ^(ghostty|kitty|alacritty|foot)$
    focus_on_activate           = false
    mouse_move_enables_dpms     = true
    key_press_enables_dpms      = true
    animate_manual_resizes      = true
    animate_mouse_windowdragging= false
    new_window_takes_over_fullscreen = 2
    middle_click_paste          = false
}

# Cursor (Hyprland built-in cursor manager)
cursor {
    no_hardware_cursors         = false
    inactive_timeout            = 0
    no_warps                    = false
    persistent_warps            = true
}

# XWayland scale (1.0 keeps legacy apps native; users on HiDPI override)
xwayland {
    force_zero_scaling = true
}
