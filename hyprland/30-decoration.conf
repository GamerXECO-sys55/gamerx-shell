# GamerX OS · Hyprland decoration (0.55-compatible)
# Verified against Caelestia + binary string dump of Hyprland 0.55.
# Removed in 0.55: dwindle:pseudotile, decoration:shadow:ignore_window,
#                  decoration:dim_*, misc:new_window_takes_over_fullscreen,
#                  general:no_border_on_floating, render:cm_fs_passthrough.

general {
    border_size                 = 2
    col.active_border           = rgb(7C3AED) rgb(00D9FF) 45deg
    col.inactive_border         = rgba(2A315888)
    layout                      = dwindle
    resize_on_border            = true
    extend_border_grab_area     = 8
    hover_icon_on_border        = true
    allow_tearing               = false
}

decoration {
    rounding = 12

    blur {
        enabled                 = true
        size                    = 6
        passes                  = 3
        new_optimizations       = true
        ignore_opacity          = true
        xray                    = false
        special                 = false
        popups                  = true
        popups_ignorealpha      = 0.6
        contrast                = 0.95
        brightness              = 1.0
        noise                   = 0.012
    }

    shadow {
        enabled                 = true
        range                   = 24
        render_power            = 3
        color                   = rgba(00000080)
        color_inactive          = rgba(00000050)
        offset                  = 0 4
        scale                   = 0.97
    }
}

dwindle {
    preserve_split      = true
    smart_split         = false
    smart_resizing      = true
    special_scale_factor= 0.95
}

master {
    new_status              = master
    mfact                   = 0.55
    orientation             = left
    smart_resizing          = true
    special_scale_factor    = 0.95
}

misc {
    disable_hyprland_logo       = true
    disable_splash_rendering    = true
    force_default_wallpaper     = 0
    vrr                         = 1
    enable_swallow              = true
    swallow_regex               = ^(ghostty|kitty|alacritty|foot)$
    focus_on_activate           = false
    mouse_move_enables_dpms     = true
    key_press_enables_dpms      = true
    animate_manual_resizes      = true
    animate_mouse_windowdragging= false
    on_focus_under_fullscreen   = 2
    middle_click_paste          = false
    allow_session_lock_restore  = true
}

cursor {
    no_hardware_cursors         = false
    inactive_timeout            = 0
    no_warps                    = false
    persistent_warps            = true
    hotspot_padding             = 1
}

xwayland {
    force_zero_scaling = true
}
