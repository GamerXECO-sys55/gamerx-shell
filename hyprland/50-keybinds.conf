# Keybinds — GamerX OS default
#
# Convention:
#   SUPER             = primary (window mgmt, launch)
#   SUPER + SHIFT     = move / destructive
#   SUPER + CTRL      = workspace / system
#   SUPER + ALT       = scratch / quick
#
# Aria reserves SUPER + SPACE — see 80-aria.conf

$mainMod = SUPER
$term    = ghostty
$files   = nautilus
$browser = zen-browser
$editor  = code

# --- Apps -------------------------------------------------------------------
bind = $mainMod, RETURN, exec, $term
bind = $mainMod, E,      exec, $files
bind = $mainMod, B,      exec, $browser
bind = $mainMod, C,      exec, $editor
bind = $mainMod, D,      exec, qs ipc call gamerx toggleLauncher
bind = $mainMod, V,      exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Live ISO: install GamerX OS (use pkexec — no terminal context for sudo)
bind = $mainMod, I,      exec, pkexec calamares

# Lock & idle
bind = $mainMod, L,           exec, hyprlock
bind = $mainMod SHIFT, L,     exec, systemctl suspend

# --- Window management ------------------------------------------------------
bind = $mainMod, Q,           killactive
bind = $mainMod SHIFT, Q,     exec, hyprctl activewindow | grep -q 'class' && hyprctl dispatch closewindow active
bind = $mainMod, F,           fullscreen, 1
bind = $mainMod SHIFT, F,     fullscreen, 0
bind = $mainMod, T,           togglefloating
bind = $mainMod, P,           layoutmsg, pseudo
bind = $mainMod, J,           layoutmsg, togglesplit

# Move focus
bind = $mainMod, left,        movefocus, l
bind = $mainMod, right,       movefocus, r
bind = $mainMod, up,          movefocus, u
bind = $mainMod, down,        movefocus, d
# (vim-style focus moved to ALT to avoid clobbering SUPER+L (lock) and SUPER+J (togglesplit))
bind = $mainMod ALT, H,       movefocus, l
bind = $mainMod ALT, L,       movefocus, r
bind = $mainMod ALT, K,       movefocus, u
bind = $mainMod ALT, J,       movefocus, d

# Move window
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Resize (submap)
bind = $mainMod, R,           submap, resize
submap = resize
binde = , left,  resizeactive, -40 0
binde = , right, resizeactive,  40 0
binde = , up,    resizeactive, 0 -40
binde = , down,  resizeactive, 0  40
bind  = , escape, submap, reset
bind  = , return, submap, reset
submap = reset

# --- Workspaces -------------------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Cycle workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1
bind = $mainMod, period,     workspace, e+1
bind = $mainMod, comma,      workspace, e-1

# Scratchpad
bind = $mainMod, S,           togglespecialworkspace, scratch
bind = $mainMod SHIFT, S,     movetoworkspace, special:scratch

# --- Screenshots ------------------------------------------------------------
bind = , Print,                exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print,           exec, grim - | swappy -f -
bind = $mainMod, Print,        exec, grim -g "$(slurp)" "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png"

# --- Audio / brightness / media (function keys) -----------------------------
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindel = , XF86AudioMute,        exec, pamixer -t
bindel = , XF86AudioMicMute,     exec, pamixer --default-source -t
bindel = , XF86MonBrightnessUp,  exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous

# --- GamerX shell overlays --------------------------------------------------
# Quickshell IPC: control center, OSD, etc.
bind = $mainMod, A,           exec, qs ipc call gamerx toggleControlCenter
bind = $mainMod, N,           exec, qs ipc call gamerx toggleNotifications

# --- Mouse drag -------------------------------------------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Reload theme (manual; gamerx-theme triggers this automatically too)
bind = $mainMod CTRL, T, exec, gamerx-theme apply
