# Input — GamerX OS default
input {
    kb_layout       = us
    kb_options      = caps:escape       # caps lock as escape (every developer agrees)
    follow_mouse    = 1
    sensitivity     = 0
    accel_profile   = flat

    touchpad {
        natural_scroll          = true
        disable_while_typing    = true
        clickfinger_behavior    = true
        tap-to-click            = true
        scroll_factor           = 0.4
    }
}

gestures {
    workspace_swipe                 = true
    workspace_swipe_fingers         = 3
    workspace_swipe_distance        = 250
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_invert          = true
    workspace_swipe_create_new      = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
