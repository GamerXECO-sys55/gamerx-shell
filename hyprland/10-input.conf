# Input — GamerX OS default
# Compatible with Hyprland 0.51+ (new gesture syntax, see 70-gestures.conf below).

input {
    kb_layout       = us
    kb_options      = caps:escape       # caps lock as escape (every developer agrees)
    follow_mouse    = 1
    sensitivity     = 0
    accel_profile   = flat

    touchpad {
        natural_scroll          = true
        disable_while_typing    = true
        clickfinger_behavior    = true
        tap-to-click            = true
        scroll_factor           = 0.4
    }
}

gestures {
    # 0.51 removed: workspace_swipe, workspace_swipe_fingers, workspace_swipe_min_fingers
    # The remaining workspace_swipe_* tunables still exist for backwards compat
    # with the new `gesture =` syntax below (they tune behavior of all `workspace`
    # gestures).
    workspace_swipe_distance           = 250
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_invert             = true
    workspace_swipe_create_new         = true
}

# New per-gesture syntax (Hyprland 0.51+).
# Three- and four-finger horizontal swipes both switch workspaces.
gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
