# GamerX OS · Input (Hyprland 0.51+)
# 0.51 removed gestures:workspace_swipe / workspace_swipe_fingers /
#               workspace_swipe_min_fingers — use `gesture =` syntax.

input {
    kb_layout       = us
    kb_options      = caps:escape
    follow_mouse    = 1
    sensitivity     = 0
    accel_profile   = flat
    repeat_delay    = 250
    repeat_rate     = 35
    focus_on_close  = 1

    touchpad {
        natural_scroll          = true
        disable_while_typing    = true
        clickfinger_behavior    = true
        tap-to-click            = true
        scroll_factor           = 0.4
    }
}

gestures {
    workspace_swipe_distance              = 250
    workspace_swipe_min_speed_to_force    = 5
    workspace_swipe_invert                = true
    workspace_swipe_create_new            = true
    workspace_swipe_direction_lock        = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_cancel_ratio          = 0.15
}

# Per-gesture bindings (0.51+)
gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace

binds {
    scroll_event_delay = 0
}

cursor {
    hotspot_padding = 1
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
