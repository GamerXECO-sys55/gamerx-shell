# GamerX OS · walker — list style (default)
# Spotlight-like vertical list with type-to-search.

[app_launch_prefix]
prefix = ""

[search]
placeholder = "Search apps, files, or type a query…"
delay       = 0
margin_spinner = 8

[ui]
fullscreen   = false
ignore_mouse = false

[ui.window]
h_align     = "center"
v_align     = "start"
width       = 720
height      = 520
margin_top  = 80
class       = "walker"

[ui.box]
orientation = "vertical"
spacing     = 0

[ui.search]
spinner = false

[ui.list]
visibility_threshold = 1
show_initial_entries = true
keyboard_scroll_style = "emacs"
margin_top = 0
margin_bottom = 0
fixed_height = false
single_click = true
max_height = 420
scrollbar_policy = "never"

[ui.icons]
size = 28
theme = "Papirus-Dark"

[ui.fonts]
font = "Inter"
icon_font = "JetBrainsMono Nerd Font"

# Built-in modules user expects to "just work"
[builtins.applications]
hidden = false
weight = 5
icon   = ""

[builtins.calc]
hidden = false
weight = 4

[builtins.clipboard]
hidden = false
weight = 3
images_only = false

[builtins.commands]
hidden = false
weight = 2

[builtins.emojis]
hidden = false
weight = 1

[builtins.runner]
hidden = false
weight = 0

[builtins.websearch]
hidden = false
weight = 0
prefix = "?"
engines = [
  { name = "DuckDuckGo", url = "https://duckduckgo.com/?q=%TERM%" },
  { name = "GitHub",     url = "https://github.com/search?q=%TERM%" },
  { name = "Arch Wiki",  url = "https://wiki.archlinux.org/index.php?search=%TERM%" }
]
