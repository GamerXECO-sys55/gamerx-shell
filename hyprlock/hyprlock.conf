# GamerX OS · hyprlock template
# Tokens like __GX_ACCENT__ are replaced by the gamerx-theme renderer.

general {
    grace                       = 0
    hide_cursor                 = true
    no_fade_in                  = false
    no_fade_out                 = false
    disable_loading_bar         = false
    immediate_render            = true
    fractional_scaling          = 1
}

# ---- Background ------------------------------------------------------------
background {
    monitor =
    path    = $HOME/.config/gamerx/wallpaper-current
    blur_passes  = 3
    blur_size    = 8
    contrast     = 0.9
    brightness   = 0.85
    noise        = 0.012
    vibrancy     = 0.10
    vibrancy_darkness = 0.0
}

# ---- Time ------------------------------------------------------------------
label {
    monitor   =
    text      = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color     = __GX_FG__
    font_size = 96
    font_family = Inter Bold
    position  = 0, 200
    halign    = center
    valign    = center
    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = __GX_ACCENT__
}

# ---- Date ------------------------------------------------------------------
label {
    monitor   =
    text      = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color     = __GX_FG_DIM__
    font_size = 18
    font_family = Inter
    position  = 0, 100
    halign    = center
    valign    = center
}

# ---- Greet -----------------------------------------------------------------
label {
    monitor   =
    text      = cmd[update:60000] echo "Hello, $USER."
    color     = __GX_HIGHLIGHT__
    font_size = 14
    font_family = Inter Medium
    position  = 0, -120
    halign    = center
    valign    = center
}

# ---- Input field -----------------------------------------------------------
input-field {
    monitor   =
    size      = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.4
    dots_center = true
    outer_color   = __GX_ACCENT__
    inner_color   = __GX_BG__
    font_color    = __GX_FG__
    fade_on_empty = true
    fade_timeout  = 1000
    placeholder_text = <i>Password</i>
    hide_input = false
    rounding   = 14
    check_color   = __GX_HIGHLIGHT__
    fail_color    = __GX_ERROR__
    fail_text     = <i>Try again</i>
    fail_transition = 220
    capslock_color  = __GX_WARN__
    numlock_color   = __GX_SUCCESS__
    bothlock_color  = __GX_HIGHLIGHT__
    invert_numlock  = false
    swap_font_color = false
    position  = 0, -220
    halign    = center
    valign    = center
}

# ---- Accent line -----------------------------------------------------------
shape {
    monitor =
    size = 240, 2
    color = __GX_ACCENT__
    rounding = 1
    border_size = 0
    rotate = 0
    position = 0, -160
    halign = center
    valign = center
}
